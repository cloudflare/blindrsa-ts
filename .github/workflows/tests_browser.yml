name: Tests (Browser)

# Partially blind RSA cannot use WebCrypto for the client operations, because
# browsers reject the metadata-derived public exponent. These tests run the
# WebAssembly backend in a real browser to check that the workaround holds.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  testing:
    name: Testing in Chromium
    runs-on: ubuntu-latest
    steps:
      - name: Checking out
        uses: actions/checkout@v6

      - name: Use Node.js v24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust WebAssembly toolchain
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.0

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('wasm/Cargo.toml', 'wasm/src/**') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install NPM dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run browser tests
        run: npm run test:browser
