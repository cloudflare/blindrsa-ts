name: Release

on:
    release:
        types:
            - published

permissions:
    contents: read
    id-token: write # Required for OIDC token used by npm trusted publishers

jobs:
    release:
        if: ${{ github.repository_owner == 'cloudflare' }}
        name: Publishing to npmjs registry
        runs-on: ubuntu-latest
        steps:
            - name: Checking out
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Use Node.js v24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'npm'

            # The WebAssembly client backend under wasm/ is built from source
            # and shipped in the package, so publishing needs the toolchain.
            - name: Install Rust WebAssembly toolchain
              run: rustup target add wasm32-unknown-unknown

            - name: Install wasm-pack
              uses: taiki-e/install-action@v2
              with:
                  tool: wasm-pack@0.13.0

            - name: Install NPM dependencies
              run: npm ci

            - name: Check build
              run: npm run build

            - name: Publish to npmjs
              run: npm publish --access public
